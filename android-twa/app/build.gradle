plugins {
    id "com.android.application"
}

android {
    namespace "com.murwy.ssoma.digital"
    compileSdk 36

    defaultConfig {
        applicationId "com.murwy.ssoma.digital"
        minSdk 23
        targetSdk 35
        versionCode 20001
        versionName "2.0.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
