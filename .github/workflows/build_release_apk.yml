name: MUR WY SSOMA DIGITAL RELEASE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable

      - name: Show build environment
        run: |
          flutter --version
          java -version

      - name: Clean Flutter
        run: flutter clean

      - name: Flutter dependencies
        run: flutter pub get

      - name: Prepare Gradle Wrapper
        run: |
          cd android
          chmod +x gradlew

      - name: Analyze project
        run: flutter analyze --no-fatal-warnings

      - name: Build release APK verbose
        run: flutter build apk --release --verbose

      - name: Inspect build output
        if: always()
        run: |
          echo "=== APK SEARCH ==="
          find . -name "*.apk" -type f || true
          echo "=== BUILD DIRECTORY ==="
          ls -R build 2>/dev/null | head -200 || true

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MUR-WY-SSOMA-DIGITAL-APK
          path: |
            build/**/*.apk
            **/*.apk
          if-no-files-found: warn
