name: MUR WY SSOMA DIGITAL RELEASE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable

      - name: Show build environment
        run: |
          flutter --version
          java -version

      - name: Clean Flutter
        run: flutter clean

      - name: Flutter dependencies
        run: flutter pub get

      - name: Repair Gradle Wrapper
        run: |
          cd android
          chmod +x gradlew

      - name: Analyze project
        run: flutter analyze --no-fatal-warnings

      - name: Build release APK
        run: |
          set +e
          flutter build apk --release --verbose
          BUILD_STATUS=$?
          set -e

          echo "Flutter build exit code: $BUILD_STATUS"
          echo "Searching APK files..."
          find . -name "*.apk" -type f || true

          if ! find . -name "*.apk" -type f | grep -q apk; then
            echo "No APK found. Running Gradle assembleRelease directly..."
            cd android
            ./gradlew assembleRelease --stacktrace
            cd ..
          fi

          find . -name "*.apk" -type f

      - name: Inspect build output
        if: always()
        run: |
          find . -name "*.apk" -type f || true
          ls -R build 2>/dev/null | head -200 || true

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MUR-WY-SSOMA-DIGITAL-APK
          path: |
            build/**/*.apk
            **/*.apk
          if-no-files-found: warn
