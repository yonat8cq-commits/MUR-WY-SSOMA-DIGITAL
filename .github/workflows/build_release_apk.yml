name: MUR WY SSOMA DIGITAL RELEASE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Clean project
        run: |
          flutter clean
          rm -rf android/.gradle

      - name: Flutter dependencies
        run: flutter pub get

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Validate Gradle
        run: gradle --version

      - name: Analyze project
        run: flutter analyze --no-fatal-warnings

      - name: Build release APK
        working-directory: android
        run: |
          gradle app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --console=plain \
            -Ptarget-platform=android-arm,android-arm64,android-x64 \
            -Ptarget=lib/main.dart \
            -Pbase-application-name=android.app.Application \
            -Pdart-obfuscation=false \
            -Ptrack-widget-creation=true \
            -Ptree-shake-icons=true

      - name: Sign test APK
        shell: bash
        run: |
          set -euo pipefail

          UNSIGNED_APK="android/app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED_APK="build/app/outputs/flutter-apk/app-release.apk"
          ALIGNED_APK="${RUNNER_TEMP}/app-release-aligned.apk"
          KEYSTORE="${RUNNER_TEMP}/mur-wy-test.jks"
          KEY_ALIAS="mur-wy-test"
          KEY_PASSWORD="$(openssl rand -hex 16)"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          BUILD_TOOLS_DIR="$(find "${SDK_ROOT}/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner -printf '%h\n' | sort -V | tail -1)"

          if [ ! -s "${UNSIGNED_APK}" ]; then
            echo "Unsigned release APK was not found at ${UNSIGNED_APK}"
            find android/app/build/outputs -name "*.apk" -type f -print || true
            exit 1
          fi

          if [ -z "${BUILD_TOOLS_DIR}" ]; then
            echo "Android SDK Build Tools with apksigner were not found"
            exit 1
          fi

          mkdir -p "$(dirname "${SIGNED_APK}")"

          keytool -genkeypair \
            -keystore "${KEYSTORE}" \
            -storepass "${KEY_PASSWORD}" \
            -keypass "${KEY_PASSWORD}" \
            -alias "${KEY_ALIAS}" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -dname "CN=MUR WY SSOMA Test, OU=SSOMA, O=MUR WY, C=PE"

          "${BUILD_TOOLS_DIR}/zipalign" -f 4 "${UNSIGNED_APK}" "${ALIGNED_APK}"

          "${BUILD_TOOLS_DIR}/apksigner" sign \
            --ks "${KEYSTORE}" \
            --ks-key-alias "${KEY_ALIAS}" \
            --ks-pass "pass:${KEY_PASSWORD}" \
            --key-pass "pass:${KEY_PASSWORD}" \
            --out "${SIGNED_APK}" \
            "${ALIGNED_APK}"

          "${BUILD_TOOLS_DIR}/apksigner" verify \
            --verbose \
            --print-certs \
            "${SIGNED_APK}"

      - name: Verify APK
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk
          sha256sum build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MUR-WY-SSOMA-DIGITAL-APK-INSTALABLE
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
