name: MUR WY SSOMA DIGITAL RELEASE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Clean project
        run: |
          flutter clean
          rm -rf android/.gradle

      - name: Flutter dependencies
        run: flutter pub get

      - name: Setup Gradle 8.7
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.7'

      - name: Validate Gradle
        run: gradle --version

      - name: Analyze project
        run: flutter analyze --no-fatal-warnings

      - name: Build release APK
        working-directory: android
        run: |
          gradle app:assembleRelease \
            --no-daemon \
            --stacktrace \
            --console=plain \
            -Ptarget-platform=android-arm,android-arm64,android-x64 \
            -Ptarget=lib/main.dart \
            -Pbase-application-name=android.app.Application \
            -Pdart-obfuscation=false \
            -Ptrack-widget-creation=true \
            -Ptree-shake-icons=true

      - name: Normalize APK output
        run: |
          APK_SOURCE="android/app/build/outputs/flutter-apk/app-release.apk"
          APK_TARGET="build/app/outputs/flutter-apk/app-release.apk"

          if [ ! -s "$APK_SOURCE" ]; then
            echo "Release APK was not found at $APK_SOURCE"
            find android/app/build/outputs -name "*.apk" -type f -print || true
            exit 1
          fi

          mkdir -p "$(dirname "$APK_TARGET")"
          cp "$APK_SOURCE" "$APK_TARGET"

      - name: Verify APK
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          ls -lh build/app/outputs/flutter-apk/app-release.apk
          sha256sum build/app/outputs/flutter-apk/app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MUR-WY-SSOMA-DIGITAL-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
