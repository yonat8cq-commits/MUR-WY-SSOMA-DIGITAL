name: MUR WY SSOMA DIGITAL RELEASE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable

      - name: Show build environment
        run: |
          flutter --version
          java -version

      - name: Clean Flutter
        run: flutter clean

      - name: Flutter dependencies
        run: flutter pub get

      - name: Repair Gradle Wrapper
        run: |
          cd android
          chmod +x gradlew
          if ! unzip -t gradle/wrapper/gradle-wrapper.jar >/dev/null 2>&1; then
            echo "Gradle wrapper jar invalid. Regenerating wrapper..."
            rm -f gradle/wrapper/gradle-wrapper.jar
            wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O /tmp/gradle.zip
            rm -rf /tmp/gradle-dist
            unzip -q /tmp/gradle.zip -d /tmp/gradle-dist
            export GRADLE_HOME=/tmp/gradle-dist/gradle-8.7
            /tmp/gradle-dist/gradle-8.7/bin/gradle wrapper --gradle-version 8.7
            chmod +x gradlew
          fi

      - name: Analyze project
        run: flutter analyze --no-fatal-warnings

      - name: Build release APK
        run: flutter build apk --release --verbose

      - name: Inspect build output
        if: always()
        run: |
          find . -name "*.apk" -type f || true
          ls -R build 2>/dev/null | head -200 || true

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: MUR-WY-SSOMA-DIGITAL-APK
          path: |
            build/**/*.apk
            **/*.apk
          if-no-files-found: warn
