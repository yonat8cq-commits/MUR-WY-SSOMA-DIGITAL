name: MUR WY SSOMA DIGITAL RELEASE APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: stable

      - name: Show build environment
        run: |
          echo "Flutter version"
          flutter --version
          echo "Java version"
          java -version

      - name: Flutter dependencies
        run: flutter pub get

      - name: Prepare Gradle Wrapper
        run: |
          cd android
          if [ ! -f gradle/wrapper/gradle-wrapper.jar ]; then
            echo "Gradle wrapper jar missing. Installing Gradle 8.7 and generating wrapper..."
            wget -q https://services.gradle.org/distributions/gradle-8.7-bin.zip -O /tmp/gradle.zip
            unzip -q /tmp/gradle.zip -d /opt
            /opt/gradle-8.7/bin/gradle wrapper --gradle-version 8.7
          fi
          chmod +x gradlew

      - name: Analyze project
        run: flutter analyze

      - name: Build release APK
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MUR-WY-SSOMA-DIGITAL-APK
          path: build/app/outputs/flutter-apk/app-release.apk
