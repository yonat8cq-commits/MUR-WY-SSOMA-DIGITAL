name: MUR WY SSOMA DIGITAL RELEASE APK

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - codex/firebase-central-v1_0_5
      - codex/apk-access-fix

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.11.1
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.11.1'

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          SDKMANAGER="${SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager"

          if [ ! -x "${SDKMANAGER}" ]; then
            SDKMANAGER="$(find "${SDK_ROOT}/cmdline-tools" -type f -name sdkmanager | sort -V | tail -1)"
          fi

          if [ -z "${SDKMANAGER}" ] || [ ! -x "${SDKMANAGER}" ]; then
            echo "Android sdkmanager was not found"
            exit 1
          fi

          "${SDKMANAGER}" "platforms;android-36" "build-tools;35.0.0"

      - name: Build central Android app
        run: gradle -p android-twa :app:assembleRelease --no-daemon --stacktrace --console=plain

      - name: Restore stable internal signing key
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/mur-wy-signing
          key: mur-wy-internal-signing-v1

      - name: Sign installable APK
        shell: bash
        run: |
          set -euo pipefail

          UNSIGNED_APK="android-twa/app/build/outputs/apk/release/app-release-unsigned.apk"
          SIGNED_APK="build/app/outputs/apk/MUR-WY-SSOMA-DIGITAL-v2.1.0.apk"
          ALIGNED_APK="${RUNNER_TEMP}/app-release-aligned.apk"
          KEYSTORE="${RUNNER_TEMP}/mur-wy-signing/mur-wy-internal.jks"
          KEY_ALIAS="mur-wy-internal"
          KEY_PASSWORD="android"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          BUILD_TOOLS_DIR="$(find "${SDK_ROOT}/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner -printf '%h\n' | sort -V | tail -1)"

          if [ ! -s "${UNSIGNED_APK}" ]; then
            echo "Unsigned release APK was not found at ${UNSIGNED_APK}"
            find android-twa/app/build/outputs -name "*.apk" -type f -print || true
            exit 1
          fi

          if [ -z "${BUILD_TOOLS_DIR}" ]; then
            echo "Android SDK Build Tools with apksigner were not found"
            exit 1
          fi

          mkdir -p "$(dirname "${SIGNED_APK}")"
          mkdir -p "$(dirname "${KEYSTORE}")"

          if [ ! -s "${KEYSTORE}" ]; then
            keytool -genkeypair \
              -keystore "${KEYSTORE}" \
              -storepass "${KEY_PASSWORD}" \
              -keypass "${KEY_PASSWORD}" \
              -alias "${KEY_ALIAS}" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 3650 \
              -dname "CN=MUR WY SSOMA Internal, OU=SSOMA, O=MUR WY, C=PE"
          fi

          "${BUILD_TOOLS_DIR}/zipalign" -f 4 "${UNSIGNED_APK}" "${ALIGNED_APK}"

          "${BUILD_TOOLS_DIR}/apksigner" sign \
            --ks "${KEYSTORE}" \
            --ks-key-alias "${KEY_ALIAS}" \
            --ks-pass "pass:${KEY_PASSWORD}" \
            --key-pass "pass:${KEY_PASSWORD}" \
            --out "${SIGNED_APK}" \
            "${ALIGNED_APK}"

          "${BUILD_TOOLS_DIR}/apksigner" verify \
            --verbose \
            --print-certs \
            "${SIGNED_APK}"

      - name: Verify APK and launcher
        shell: bash
        run: |
          set -euo pipefail
          APK="build/app/outputs/apk/MUR-WY-SSOMA-DIGITAL-v2.1.0.apk"
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          AAPT="$(find "${SDK_ROOT}/build-tools" -mindepth 2 -maxdepth 2 -type f -name aapt | sort -V | tail -1)"

          test -s "${APK}"
          test -x "${AAPT}"
          "${AAPT}" dump badging "${APK}" | tee "${RUNNER_TEMP}/apk-badging.txt"
          grep -F "package: name='com.murwy.ssoma.digital' versionCode='20100' versionName='2.1.0'" "${RUNNER_TEMP}/apk-badging.txt"
          grep -F "launchable-activity: name='com.murwy.ssoma.digital.MainActivity'" "${RUNNER_TEMP}/apk-badging.txt"
          unzip -l "${APK}" | grep -F "classes.dex"
          ls -lh "${APK}"
          sha256sum "${APK}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MUR-WY-SSOMA-DIGITAL-v2.1.0-INSTALABLE
          path: build/app/outputs/apk/MUR-WY-SSOMA-DIGITAL-v2.1.0.apk
          if-no-files-found: error
